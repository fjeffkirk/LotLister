# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lotlister
    runtime: node
    region: oregon
    buildCommand: npm ci --include=dev && NODE_OPTIONS="--max-old-space-size=512" npm run build
    # Applies migrations (and the one-time SQLite import when IMPORT_SQLITE_PATH is set), then starts
    startCommand: node scripts/db-migrate.mjs && npm start
    envVars:
      # Cap Node heap below Render's 512MB container limit (Sharp/native memory sits outside heap)
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Internal connection string of the shared Render Postgres database (the one StockPilot uses)
      - key: DATABASE_URL
        sync: false
      # Old LotLister SQLite file, copied into Postgres once on the first start after the move
      - key: IMPORT_SQLITE_PATH
        value: /data/lotlister.sqlite
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: NODE_ENV
        value: production
      # This will be set after first deploy when you know your URL
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # PSA API token for cert lookup
      - key: PSA_API_TOKEN
        sync: false
      # eBay production keysets (developer.ebay.com → Application Keys → Production)
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      # Production RuName from User Tokens → Get a Token from eBay via Your Application
      - key: EBAY_RU_NAME
        sync: false
      # Marketplace Account Deletion notifications (eBay → Alerts & Notifications)
      - key: EBAY_DELETION_VERIFICATION_TOKEN
        sync: false
      # Exact URL entered in eBay, e.g. https://<your-app>.onrender.com/api/ebay/account-deletion
      - key: EBAY_DELETION_ENDPOINT_URL
        sync: false
      - key: EBAY_ALLOWED_USERS
        sync: false
    disk:
      name: lotlister-data
      mountPath: /data
      sizeGB: 1
